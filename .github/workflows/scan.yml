name: KoyEviBot Tarama

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      delete_seen_ids:
        description: "seen.db'den silinecek ilan ID'leri (virgülle ayrılmış, örn: 19623087,19623088)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: koyevibot-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: seen.db önbelleğini geri yükle
        uses: actions/cache@v4
        with:
          path: seen.db
          key: seen-db-${{ github.run_id }}
          restore-keys: |
            seen-db-

      - name: Belirtilen ilanları seen.db'den sil
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.delete_seen_ids != '' }}
        run: |
          python3 - <<'EOF'
          import sqlite3, os
          ids = os.environ["DELETE_IDS"].split(",")
          if not os.path.exists("seen.db"):
              print("seen.db yok, atlanıyor.")
          else:
              conn = sqlite3.connect("seen.db")
              for raw in ids:
                  lid = raw.strip()
                  if lid:
                      conn.execute("DELETE FROM seen WHERE id = ?", (lid,))
                      print(f"Silindi (seen): {lid}")
              conn.commit()
              conn.close()
          EOF
        env:
          DELETE_IDS: ${{ inputs.delete_seen_ids }}

      - name: Botu çalıştır
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_FORUM_CHAT_ID: ${{ secrets.TELEGRAM_FORUM_CHAT_ID }}
        run: python3 bot.py

      - name: dashboard.html ve topics.json değiştiyse commit'le
        run: |
          git config user.name "KoyEviBot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard.html
          test -f topics.json && git add topics.json || true
          test -f seen_ids.json && git add seen_ids.json || true
          # Değişiklik yoksa çık
          if git diff --cached --quiet; then
            echo "Değişiklik yok, commit atlanıyor."
            exit 0
          fi
          git commit -m "Dashboard + topic + seen ID'leri güncellendi [skip ci]"
          # Remote sapmışsa (manuel push / başka çalışma) rebase edip tekrar dene —
          # düz 'git push' fetch-first ile fail veriyordu; artık dayanıklı.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Push başarılı (deneme $attempt)."
              exit 0
            fi
            echo "Push reddedildi (deneme $attempt), remote ile rebase ediliyor..."
            git fetch origin main
            git rebase origin/main || { git rebase --abort; sleep 3; continue; }
            sleep 2
          done
          echo "::error::Push 5 denemede başarısız oldu."
          exit 1
